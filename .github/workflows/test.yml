name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shared (Extension)/Resources
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Shared (Extension)/Resources/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
